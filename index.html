<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
    <style>
        /* CSS: Estilização */
        body { background: #121212; color: white; font-family: sans-serif; display: flex; justify-content: center; padding: 20px; }
        .app-container { width: 100%; max-width: 400px; }
        
        .progress-container { position: relative; background: #333; height: 30px; border-radius: 15px; margin-bottom: 20px; overflow: hidden; width: 100%; }
        #progress-fill { background: #4caf50; height: 100%; width: 0%; transition: width 0.5s; }
        #progress-text { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; font-weight: bold; pointer-events: none; }
        
        .input-group { display: flex; gap: 5px; margin-bottom: 20px; }
        input { flex: 1; padding: 10px; border-radius: 5px; border: none; }
        button { padding: 10px; cursor: pointer; background: #4caf50; color: white; border: none; border-radius: 5px; }
        
        ul { list-style: none; padding: 0; }
        li { background: #252525; margin-bottom: 10px; padding: 15px; border-radius: 8px; cursor: pointer; display: flex; align-items: center; gap: 10px; }
        li.done { text-decoration: line-through; opacity: 0.6; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="progress-container">
        <div id="progress-fill"></div>
        <span id="progress-text">0%</span>
    </div>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Nova tarefa...">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="todo-list"></ul>
</div>

<!-- ... (mesmo HTML e CSS de antes) ... -->

<script>
    /* Inicializa a lista lendo o que já está salvo no navegador */
    let tarefas = JSON.parse(localStorage.getItem('minhasTarefas')) || [];

    // Função que salva no "banco" do navegador
    function salvar() {
        localStorage.setItem('minhasTarefas', JSON.stringify(tarefas));
    }

    function atualizarProgresso() {
        const total = tarefas.length;
        const concluidas = tarefas.filter(t => t.concluida).length;
        const porcentagem = total === 0 ? 0 : Math.round((concluidas / total) * 100);

        document.getElementById('progress-fill').style.width = porcentagem + "%";
        document.getElementById('progress-text').innerText = porcentagem + "%";
    }

    function adicionarTarefa() {
        const input = document.getElementById('taskInput');
        if (input.value === "") return;
        
        tarefas.push({ texto: input.value, concluida: false });
        input.value = "";
        salvar(); // Salva no localStorage
        renderizar();
    }

    function toggleTarefa(index) {
        tarefas[index].concluida = !tarefas[index].concluida;
        salvar(); // Salva no localStorage
        renderizar();
    }

    function renderizar() {
        const lista = document.getElementById('todo-list');
        lista.innerHTML = "";
        tarefas.forEach((t, i) => {
            const li = document.createElement('li');
            li.className = t.concluida ? 'done' : '';
            li.innerHTML = `<span>${t.concluida ? '✅' : '⬜'}</span> ${t.texto}`;
            li.onclick = () => toggleTarefa(i);
            lista.appendChild(li);
        });
        atualizarProgresso();
    }

    // Carrega a lista assim que a página abrir
    renderizar();
</script>
</body>
</html>
