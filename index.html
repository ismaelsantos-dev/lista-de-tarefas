<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Tarefas</title>
    <style>
        /* CSS: Estilização responsiva e moderna */
        * { box-sizing: border-box; }
        body { 
            background: #121212; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            justify-content: center; 
            padding: 15px; 
            margin: 0;
        }
        .app-container { 
            width: 100%; 
            max-width: 400px; 
        }
        
        .progress-container { 
            position: relative; 
            background: #333; 
            height: 30px; 
            border-radius: 15px; 
            margin-bottom: 20px; 
            overflow: hidden; 
            width: 100%; 
        }
        #progress-fill { background: #4caf50; height: 100%; width: 0%; transition: width 0.5s; }
        #progress-text { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-weight: bold; 
            pointer-events: none; 
        }
        
        .input-group { 
            display: flex; 
            gap: 8px; 
            margin-bottom: 20px; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border-radius: 8px; 
            border: none; 
            font-size: 16px; /* Evita zoom automático em alguns celulares */
            background: #252525;
            color: white;
        }
        button { 
            padding: 12px 16px; 
            cursor: pointer; 
            background: #4caf50; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold;
        }
        button:active { opacity: 0.8; }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li { 
            background: #252525; 
            margin-bottom: 10px; 
            padding: 12px 15px; 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            justify-content: space-between;
            gap: 10px; 
        }
        .task-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            cursor: pointer;
            word-break: break-word;
        }
        li.done .task-content { text-decoration: line-through; opacity: 0.5; }

        .btn-delete {
            background: #e53935;
            padding: 8px 12px;
            font-size: 14px;
            border-radius: 6px;
        }

        .btn-clear-all {
            width: 100%;
            background: #333;
            color: #ff5252;
            margin-top: 15px;
            border: 1px solid #ff5252;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="progress-container">
        <div id="progress-fill"></div>
        <span id="progress-text">0%</span>
    </div>

    <div class="input-group">
        <input type="text" id="taskInput" placeholder="Nova tarefa..." onkeypress="checarEnter(event)">
        <button onclick="adicionarTarefa()">Adicionar</button>
    </div>

    <ul id="todo-list"></ul>

    <button class="btn-clear-all" onclick="apagarTudo()">Limpar Todas as Tarefas</button>
</div>

<script>
    let tarefas = JSON.parse(localStorage.getItem('minhasTarefas')) || [];

    function salvar() {
        localStorage.setItem('minhasTarefas', JSON.stringify(tarefas));
    }

    function atualizarProgresso() {
        const total = tarefas.length;
        const concluidas = tarefas.filter(t => t.concluida).length;
        const porcentagem = total === 0 ? 0 : Math.round((concluidas / total) * 100);

        document.getElementById('progress-fill').style.width = porcentagem + "%";
        document.getElementById('progress-text').innerText = porcentagem + "%";
    }

    function adicionarTarefa() {
        const input = document.getElementById('taskInput');
        if (input.value.trim() === "") return;
        
        tarefas.push({ texto: input.value.trim(), concluida: false });
        input.value = "";
        salvar();
        renderizar();
    }

    function checarEnter(event) {
        if (event.key === 'Enter') {
            adicionarTarefa();
        }
    }

    function toggleTarefa(index) {
        tarefas[index].concluida = !tarefas[index].concluida;
        salvar();
        renderizar();
    }

    function apagarTarefa(event, index) {
        event.stopPropagation(); // Evita marcar a tarefa como concluída ao clicar no botão de apagar
        tarefas.splice(index, 1);
        salvar();
        renderizar();
    }

    function apagarTudo() {
        if (tarefas.length === 0) return;
        if (confirm("Deseja realmente apagar todas as tarefas?")) {
            tarefas = [];
            salvar();
            renderizar();
        }
    }

    function renderizar() {
        const lista = document.getElementById('todo-list');
        lista.innerHTML = "";
        
        tarefas.forEach((t, i) => {
            const li = document.createElement('li');
            li.className = t.concluida ? 'done' : '';
            
            li.innerHTML = `
                <div class="task-content" onclick="toggleTarefa(${i})">
                    <span>${t.concluida ? '✅' : '⬜'}</span> 
                    <span>${t.texto}</span>
                </div>
                <button class="btn-delete" onclick="apagarTarefa(event, ${i})">🗑️</button>
            `;
            
            lista.appendChild(li);
        });
        atualizarProgresso();
    }

    renderizar();
</script>
</body>
</html>
